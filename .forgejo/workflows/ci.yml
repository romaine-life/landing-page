name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      # One number per commit for the image, the pages and the release (PIPT-7).
      - id: version
        uses: romaine-life/pipeline-templates/actions/release-version@main
        with:
          prefix: v1.0
          publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test and build application
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/setup-node@main
        with:
          node-version: '22'
      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
          downloadBaseURL: https://artifacts.home.romaine.life/general/helm-downloads/
      - name: Validate chart
        run: |
          helm lint k8s
          helm template landing-page k8s --namespace landing-page >/tmp/landing-page.yaml
      - name: Download fzt-browser release assets for /fzh
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          authcurl() { printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -K - "$@"; }
          api="${{ github.server_url }}/api/v1/repos/romaine-life/fzt-browser"
          authcurl -fsS "$api/releases/latest" > /tmp/browser-release.json
          version=$(jq -er .tag_name /tmp/browser-release.json)
          for asset in fzt.wasm fzt-terminal.js fzt-terminal.css fzt-web.js; do
            url=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' /tmp/browser-release.json)
            authcurl -fLSs "$url" -o "frontend/fzh/$asset"
          done
          jq -n --arg v "$version" --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{fztBrowser:$v,version:$version,deployedAt:$date}' > frontend/fzh/version.json
      - name: Download the String Box board model for /string-box
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          authcurl() { printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -K - "$@"; }
          api="${{ github.server_url }}/api/v1/repos/romaine-life/string-box"
          sha=$(authcurl -fsS "$api/commits?sha=main&path=renders/string-box.glb&limit=1" | jq -er '.[0].sha')
          mkdir -p string-box/public
          authcurl -fLSs "$api/raw/renders/string-box.glb?ref=$sha" -o string-box/public/string-box.glb
          test -s string-box/public/string-box.glb
          echo "string-box.glb from romaine-life/string-box@$sha"
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=artifacts.home.romaine.life/dockerhub/moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: landing-page:check
          network: host
          build-args: |
            APP_VERSION=${{ needs.changes.outputs.version }}
            SOURCE_SHA=${{ github.sha }}
      - name: Smoke-test container
        run: |
          set -euo pipefail
          name="landing-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --network none --name "$name" landing-page:check
          for n in $(seq 1 40); do
            if docker exec "$name" node -e 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          docker exec "$name" node -e 'const assert=require("node:assert/strict"); (async()=>{for(const p of ["/", "/privacy.html", "/style.css", "/fzh/", "/fzh/fzt.wasm", "/diagrams/", "/diagrams/fzt", "/string-box/", "/string-box/string-box.glb", "/unknown/path"]){const r=await fetch("http://127.0.0.1:3000"+p); assert.equal(r.status,200,p); assert.ok((await r.text()).length>0,p)} assert.equal(await (await fetch("http://127.0.0.1:3000/health")).text(),"ok")})().catch(e=>{console.error(e);process.exit(1)})'

  deploy:
    name: Publish image and propose pin
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    enable-openid-connect: true
    env:
      REGISTRY: romainecr.azurecr.io
      IMAGE: landing-page
      TAG: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
      - name: Determine whether image inputs changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo changed=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The image's inputs are what the Dockerfile copies from the repo, plus the files that build it.
          inputs="$(sed -n 's/^COPY \([^-][^ ]*\) .*/\1/p' Dockerfile | sed 's/\*.*$//') Dockerfile .dockerignore .forgejo/workflows/ci.yml"
          echo "image inputs:" $inputs
          for f in $(git diff --name-only "$BASE_SHA" HEAD); do
            for p in $inputs; do
              case "$f" in "$p"*) echo "changed: $f"; echo changed=true >> "$GITHUB_OUTPUT"; exit 0 ;; esac
            done
          done
      - uses: romaine-life/pipeline-templates/actions/azure-cli@main
        if: steps.scope.outputs.changed == 'true'
      - name: Azure login
        if: steps.scope.outputs.changed == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
      - name: Registry login
        if: steps.scope.outputs.changed == 'true'
        run: az acr login --name romainecr
      - name: Download fzt-browser release assets for /fzh
        if: steps.scope.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          authcurl() { printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -K - "$@"; }
          api="${{ github.server_url }}/api/v1/repos/romaine-life/fzt-browser"
          authcurl -fsS "$api/releases/latest" > /tmp/browser-release.json
          version=$(jq -er .tag_name /tmp/browser-release.json)
          for asset in fzt.wasm fzt-terminal.js fzt-terminal.css fzt-web.js; do
            url=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' /tmp/browser-release.json)
            authcurl -fLSs "$url" -o "frontend/fzh/$asset"
          done
          jq -n --arg v "$version" --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{fztBrowser:$v,version:$version,deployedAt:$date}' > frontend/fzh/version.json
      - name: Download the String Box board model for /string-box
        if: steps.scope.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          authcurl() { printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -K - "$@"; }
          api="${{ github.server_url }}/api/v1/repos/romaine-life/string-box"
          sha=$(authcurl -fsS "$api/commits?sha=main&path=renders/string-box.glb&limit=1" | jq -er '.[0].sha')
          mkdir -p string-box/public
          authcurl -fLSs "$api/raw/renders/string-box.glb?ref=$sha" -o string-box/public/string-box.glb
          test -s string-box/public/string-box.glb
          echo "string-box.glb from romaine-life/string-box@$sha"
      - uses: docker/setup-buildx-action@v4
        if: steps.scope.outputs.changed == 'true'
        with:
          driver-opts: |
            network=host
            image=artifacts.home.romaine.life/dockerhub/moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build and push image
        if: steps.scope.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG }}
          network: host
          build-args: |
            APP_VERSION=${{ needs.changes.outputs.version }}
            SOURCE_SHA=${{ github.sha }}
      - name: Smoke-test published image
        if: steps.scope.outputs.changed == 'true'
        run: |
          set -euo pipefail
          name="landing-published-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --network none --name "$name" "$REGISTRY/$IMAGE:$TAG"
          for n in $(seq 1 40); do
            if docker exec "$name" node -e 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          docker exec "$name" node -e 'const assert=require("node:assert/strict"); (async()=>{assert.equal(await (await fetch("http://127.0.0.1:3000/health")).text(),"ok");for(const p of ["/","/privacy.html","/style.css","/fzh/","/fzh/fzt.wasm","/diagrams/","/diagrams/fzt","/string-box/","/string-box/string-box.glb"]){const r=await fetch("http://127.0.0.1:3000"+p);assert.equal(r.status,200,p);assert.ok((await r.text()).length>0,p)}})().catch(e=>{console.error(e);process.exit(1)})'
      - name: Propose and merge checked pin
        if: steps.scope.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          branch="FORGEJO-3-image-$GITHUB_RUN_ID"
          git switch -c "$branch"
          # quoted so YAML always reads the tag as a string
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" k8s/values.yaml
          git config user.name forgejo-actions
          git config user.email forgejo-actions@noreply.romaine.life
          git add k8s/values.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: pin landing-page image $TAG"
          git push origin "$branch"
          body=$(jq -n --arg head "$branch" '{head:$head,base:"main",title:"Deploy validated landing-page image",body:"https://openproject.romaine.life/wp/FORGEJO-3"}')
          pr=$(printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS --header @- -H 'Content-Type: application/json' -d "$body" "$api/pulls" | jq -er .number)
          head=$(git rev-parse HEAD)
          passed=false
          for n in $(seq 1 60); do
            statuses=$(printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS --header @- "$api/commits/$head/status")
            state=$(echo "$statuses" | jq -r '[.statuses[]? | select(.context == "CI / Test and build application (pull_request)")] | sort_by(.updated_at) | last | .status // "pending"')
            if [ "$state" = failure ] || [ "$state" = error ]; then echo "Pin PR $pr failed checks"; exit 1; fi
            if [ "$state" = success ]; then passed=true; break; fi
            sleep 30
          done
          if [ "$passed" != true ]; then echo "Pin PR $pr did not pass checks"; exit 1; fi
          body=$(jq -n --arg head "$head" '{Do:"squash",delete_branch_after_merge:true,head_commit_id:$head}')
          printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS --header @- -H 'Content-Type: application/json' -d "$body" "$api/pulls/$pr/merge"
      - name: Release validated source
        if: needs.changes.outputs.tag != ''
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          RELEASE: ${{ needs.changes.outputs.tag }}
          CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          set -euo pipefail
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          # A re-run of a released commit keeps its number and release.
          code=$(printf 'Authorization: token %s\n' "$TOKEN" | curl -sS -o /dev/null -w '%{http_code}' --header @- "$api/releases/tags/$RELEASE")
          if [ "$code" = 200 ]; then echo "$RELEASE is already released"; exit 0; fi
          [ "$code" = 404 ] || { echo "::error::release lookup for $RELEASE returned HTTP $code"; exit 1; }
          # The image this commit runs: its own when it built one, else the pinned one.
          if [ "$CHANGED" = true ]; then image_tag=$TAG; else image_tag=$(sed -n 's/^  tag: *//p' k8s/values.yaml | tr -d '\"'); fi
          test -n "$image_tag"
          body=$(jq -n --arg tag "$RELEASE" --arg sha "$GITHUB_SHA" --arg image "$REGISTRY/$IMAGE:$image_tag" '{tag_name:$tag,target_commitish:$sha,name:$tag,body:("Image: "+$image)}')
          printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS --header @- -H 'Content-Type: application/json' -d "$body" "$api/releases"
