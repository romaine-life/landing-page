apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: landing-page
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  parentRefs:
    - group: {{ .Values.gateway.parentGateway.group | quote }}
      kind: {{ .Values.gateway.parentGateway.kind | quote }}
      name: {{ .Values.gateway.parentGateway.name | quote }}
      namespace: {{ .Values.gateway.parentGateway.namespace | quote }}
    - group: gateway.networking.x-k8s.io
      kind: XListenerSet
      name: landing-page
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: landing-page
          port: {{ .Values.service.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
