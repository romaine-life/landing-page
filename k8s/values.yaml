# The image by tag and digest, rewritten by the suite's pin PR on each release.
image: romainecr.azurecr.io/landing-page:v1.0.55@sha256:cc40163561f825e3d98079f3e256b05a9fd55b824846937bff7ae2e1a1969bd0
imagePullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: infra-shared

service:
  port: 80
  targetPort: http

container:
  port: 3000

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

gateway:
  hostname: romaine.life
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main
    namespace: envoy-gateway-system
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
