# The image by tag and digest, rewritten by the suite's pin PR on each release.
image: romainecr.azurecr.io/landing-page:v1.0.45@sha256:218e11df43375cabbc9f791c2fbb597d885a8a12354e8e217fa8e3ca68815f10
imagePullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: infra-shared

service:
  port: 80
  targetPort: http

container:
  port: 3000

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

gateway:
  hostname: romaine.life
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main
    namespace: envoy-gateway-system
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
