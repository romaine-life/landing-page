# The image by tag and digest, rewritten by the suite's pin PR on each release.
image: romainecr.azurecr.io/landing-page:v1.0.73@sha256:0de18a9e0f02f9617e8fb3815eadf1ec3197287b8ebea0862b1f5e172f7984bc
imagePullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: infra-shared

service:
  port: 80
  targetPort: http

container:
  port: 3000

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

gateway:
  hostname: romaine.life
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main
    namespace: envoy-gateway-system
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
