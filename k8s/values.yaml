# The image by tag and digest, rewritten by the suite's pin PR on each release.
image: romainecr.azurecr.io/landing-page:v1.0.46@sha256:c0ab3049c8a2a8bb553c0a5679cfa027d5167d0b848f89f725cfdb33c45a8702
imagePullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: infra-shared

service:
  port: 80
  targetPort: http

container:
  port: 3000

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

gateway:
  hostname: romaine.life
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main
    namespace: envoy-gateway-system
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
