# The image by tag and digest, rewritten by the suite's pin PR on each release.
image: romainecr.azurecr.io/landing-page:v1.0.47@sha256:bbaca85a3ebdbd9f824116a8a866f55f4b686c476276e17c4e3def1430eb6fc8
imagePullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: infra-shared

service:
  port: 80
  targetPort: http

container:
  port: 3000

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

gateway:
  hostname: romaine.life
  parentGateway:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main
    namespace: envoy-gateway-system
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
