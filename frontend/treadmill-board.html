tf.colorSpace=tb.colorSpace=THREE.SRGBColorSpace;
const W=3.2,H=W*640/1800,T=0.035;
const edge=new THREE.MeshStandardMaterial({color:0x0f6b3a,roughness:.8});
const mats=[edge,edge,edge,edge,new THREE.MeshBasicMaterial({map:tf}),new THREE.MeshBasicMaterial({map:tb})];
const board=new THREE.Mesh(new THREE.BoxGeometry(W,H,T),mats); scene.add(board);
scene.add(new THREE.AmbientLight(0xffffff,1.2)); const d=new THREE.DirectionalLight(0xffffff,1); d.position.set(2,3,4); scene.add(d);
let spin=false;
document.getElementById('spin').onclick=()=>spin=!spin;
function goto(az){spin=false; const tgt=new THREE.Vector3(Math.sin(az)*4.2,0.9,Math.cos(az)*4.2); const s=cam.position.clone(); let t=0; const id=setInterval(()=>{t+=0.05; cam.position.lerpVectors(s,tgt,Math.min(1,t)); if(t>=1)clearInterval(id);},16);}
document.getElementById('front').onclick=()=>goto(0);
document.getElementById('back').onclick=()=>goto(Math.PI);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop); if(spin)board.rotation.y+=0.01; ctl.update(); r.render(scene,cam);})();
</script></body></html>
