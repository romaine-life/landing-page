name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - Dockerfile
      - .dockerignore
      - k8s/**
      - .github/workflows/build-and-deploy.yaml
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref or commit SHA to build. Leave blank to build the dispatch revision."
        required: false
        type: string

permissions:
  id-token: write
  contents: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image, push, bump chart values
    runs-on: ubuntu-latest
    env:
      REGISTRY: romainecr.azurecr.io
      IMAGE: landing-page
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve requested ref
        env:
          INPUT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          target_ref="${INPUT_REF:-$GITHUB_SHA}"
          if full_sha="$(git rev-parse --verify "${target_ref}^{commit}" 2>/dev/null)"; then
            :
          elif git show-ref --verify --quiet "refs/remotes/origin/${target_ref}"; then
            full_sha="$(git rev-parse "refs/remotes/origin/${target_ref}^{commit}")"
          elif git show-ref --verify --quiet "refs/tags/${target_ref}"; then
            full_sha="$(git rev-parse "refs/tags/${target_ref}^{commit}")"
          else
            echo "::error::Unable to resolve git_ref '${target_ref}' to a commit."
            exit 1
          fi
          git checkout --detach "$full_sha"
          echo "Resolved ${target_ref} -> ${full_sha}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Azure Login (OIDC)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.git_ref == '' || inputs.git_ref == 'main'))
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Resolve image tag
        id: tag
        run: |
          TAG="$(git rev-parse --short=7 HEAD)"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Built ref $(git rev-parse HEAD) as ${REGISTRY}/${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve deployment mode
        id: deploy-mode
        env:
          INPUT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          deploy=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            deploy=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] && { [ -z "${INPUT_REF}" ] || [ "${INPUT_REF}" = "main" ]; }; then
            deploy=true
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint k8s
          helm template landing-page k8s --namespace landing-page >/tmp/landing-page.yaml

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without pushing
        if: steps.deploy-mode.outputs.deploy != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute next version
        if: steps.deploy-mode.outputs.deploy == 'true'
        id: next-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release list --limit 1 --json tagName -q '.[0].tagName // empty')
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            patch=$(echo "$latest" | sed 's/v[0-9]*\.[0-9]*\.//')
            major_minor=$(echo "$latest" | sed 's/\.[0-9]*$//')
            next="${major_minor}.$((patch + 1))"
          fi
          echo "version=$next" >> $GITHUB_OUTPUT
          echo "Next landing-page version: $next"

      - name: ACR login
        if: steps.deploy-mode.outputs.deploy == 'true'
        run: az acr login --name romainecr

      - name: Check existing image tag
        if: steps.deploy-mode.outputs.deploy == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if az acr repository show-tags \
              --name romainecr \
              --repository "${IMAGE}" \
              --query "[?@=='${TAG}'] | [0]" \
              --output tsv | grep -qx "${TAG}"; then
            echo "target_exists=true" >>"${GITHUB_OUTPUT}"
          else
            echo "target_exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Build and push image
        if: steps.deploy-mode.outputs.deploy == 'true' && steps.image.outputs.target_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-build-cache:app
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-build-cache:app,mode=max

      - name: Bump image tag in chart values
        if: steps.deploy-mode.outputs.deploy == 'true'
        run: |
          node <<'JS'
          const fs = require('fs');
          const path = 'k8s/values.yaml';
          const tag = process.env.TAG;
          const before = fs.readFileSync(path, 'utf8');
          const after = before.replace(/^  tag: .+$/m, `  tag: ${tag}`);
          if (after === before) {
            throw new Error('values.yaml image tag was not updated');
          }
          fs.writeFileSync(path, after);
          JS

      - name: Commit and push tag bump
        if: steps.deploy-mode.outputs.deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/values.yaml
          if git diff --cached --quiet; then
            echo "No chart values changes to commit"
            exit 0
          fi
          git commit -m "chore: bump landing-page image to ${{ env.TAG }} [skip ci]"
          git push origin HEAD:main

      - name: Create release tag
        if: steps.deploy-mode.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Image: romainecr.azurecr.io/landing-page:${{ env.TAG }}"
